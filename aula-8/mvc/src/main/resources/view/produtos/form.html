<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produto')}"></head>
<body>
  <header th:replace="~{fragments/layout :: menu}"></header>
  <main>
    <h1 th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'">Produto</h1>

    <form class="card" method="post" th:object="${produto}"
          th:action="${produto.id == null} ? @{/produtos} : @{/produtos/{id}(id=${produto.id})}">
      <label for="nome">Nome</label>
      <input id="nome" type="text" th:field="*{nome}" required>

      <label for="descricao">Descrição</label>
      <input id="descricao" type="text" th:field="*{descricao}">

      <label for="preco">Preço (R$)</label>
      <input id="preco" type="number" step="0.01" min="0" th:field="*{preco}" required>

      <p th:if="${produto.id == null}">
        O produto será criado com status <strong>INDISPONÍVEL</strong> e estoque zero.
      </p>
      <p th:unless="${produto.id == null}">
        Status atual: <strong th:text="${produto.status.descricao}"></strong>
        (o status muda pelo estoque ou pela ação de descontinuar).
      </p>

      <button type="submit">Salvar</button>
      <a th:href="@{/produtos}">Cancelar</a>
    </form>
  </main>
</body>
</html>
