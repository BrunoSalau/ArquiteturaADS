<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>
  <header th:replace="~{fragments/layout :: menu}"></header>
  <main>
    <h1>Pedidos de venda</h1>

    <form class="card" method="post" th:action="@{/pedidos}">
      <h2>Novo pedido</h2>
      <label for="cliente">Cliente</label>
      <input id="cliente" name="cliente" type="text" required>
      <label for="emailCliente">E-mail do cliente</label>
      <input id="emailCliente" name="emailCliente" type="email" required>
      <p><button type="submit">Abrir pedido</button></p>
    </form>

    <table>
      <thead>
        <tr><th>#</th><th>Cliente</th><th>Total</th><th>Status</th><th>Fatura (hub)</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${pedidos}">
          <td th:text="${p.id}"></td>
          <td th:text="${p.cliente}"></td>
          <td th:text="|R$ ${#numbers.formatDecimal(p.valorTotal, 1, 'POINT', 2, 'COMMA')}|"></td>
          <td><span th:class="|status status-${p.status}|" th:text="${p.status.descricao}"></span></td>
          <td th:text="${p.faturaId} ?: '-'"></td>
          <td><a th:href="@{/pedidos/{id}(id=${p.id})}">Abrir</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedidos)}">
          <td colspan="6">Nenhum pedido.</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
