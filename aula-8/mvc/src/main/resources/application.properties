spring.application.name=mvc
spring.thymeleaf.prefix=classpath:/view/

server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vendasdb;WRITE_DELAY=0}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hub de faturamento (projeto da aula 7)
hub.faturamento.url=${HUB_URL:http://localhost:8081}
hub.faturamento.timeout-ms=${HUB_TIMEOUT_MS:5000}
